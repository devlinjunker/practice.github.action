name: Manage TODO issues

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

permissions:
  contents: read
  issues: write

jobs:
  todo-issues:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}

    steps:
      - name: Checkout full history
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Ensure `code-todo` label exists
        run: |
          if ! gh label list --repo "$GITHUB_REPOSITORY" | grep -q '^code-todo'; then
            gh label create code-todo \
              --repo "$GITHUB_REPOSITORY" \
              --color FFD700 \
              --description "Issues generated from TODO comments in code"
          fi

      - name: Process TODO diffs
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          sha="$GITHUB_SHA"
          pr_url="$PR_URL"
          pr_num="$PR_NUMBER"

          git fetch origin "${{ github.base_ref }}"
          git diff origin/"${{ github.base_ref }}" --unified=0 |
          while IFS= read -r line; do
            if [[ $line =~ ^diff\ --git\ a\/.+\ b\/(.+)$ ]]; then
              file="${BASH_REMATCH[1]}"
            fi
            if [[ $line =~ ^@@\ -[0-9,]+\ \+([0-9,]+)\ @@ ]]; then
              new_line="${BASH_REMATCH[1]%%,*}"
            fi

            # REMOVED TODO → comment on the issue
            if [[ $line =~ ^-\ *(//|#|/\*|<!--)\ TODO ]]; then
              old_txt="${line#*-*TODO }"
              num=$(gh issue list --repo "$repo" --state open --search "$old_txt" \
                    --json number --jq '.[0].number')
              if [[ -n "$num" && "$num" != "null" ]]; then
                gh issue comment "$num" \
                  --body "⚠️ The TODO \`$old_txt\` was removed in PR $pr_url (#$pr_num); please review if this issue can now be closed."
              fi
            fi

            # ADDED or UPDATED TODO → create or comment/overwrite
            if [[ $line =~ ^\+\ *(//|#|/\*|<!--)\ TODO ]]; then
              new_txt="${line#*+*TODO }"
              url="https://github.com/$repo/blob/$sha/$file#L$new_line"
              title="TODO in $file:$new_line – $new_txt"

              existing=$(gh issue list --repo "$repo" --state open --search "$new_txt" \
                         --json number --jq '.[0].number')

              if [[ -n "$existing" && "$existing" != "null" ]]; then
                # fetch current issue body
                issue_body=$(gh issue view "$existing" --repo "$repo" --json body --jq .body)

                if [[ "$issue_body" == *"$pr_url"* ]]; then
                  # same PR – overwrite body as if new
                  gh api repos/"$repo"/issues/"$existing" -X PATCH \
                    -f title="$title" \
                    -f body="🆕 Found TODO in file [$file:$new_line]($url):<br/><blockquote>$new_txt</blockquote>PR: $pr_url (#$pr_num)<br/>Commit: $sha"
                else
                  # different PR – add a comment
                  gh issue comment "$existing" \
                    --body "🔄 Updated TODO: $new_txt<br/>Location: [$file:$new_line]($url)<br/>PR: $pr_url (#$pr_num)<br/>Commit: $sha"
                fi

                echo "::warning file=$file,line=$new_line,title=Updated TODO::A TODO was updated to '$new_txt' in PR #$pr_num; see issue #$existing"
              else
                # brand-new TODO → create issue
                issue_url=$(gh api repos/"$repo"/issues -X POST \
                  -F title="$title" \
                  -F body="🆕 Found TODO in file [$file:$new_line]($url):<br/><blockquote>$new_txt</blockquote>PR: $pr_url (#$pr_num)<br/>Commit: $sha" \
                  -f labels:='["code-todo"]' \
                  --jq .html_url)
                echo "::warning file=$file,line=$new_line,title=New TODO::A new TODO '$new_txt' was added in PR #$pr_num; see $issue_url"
              fi
            fi
          done
